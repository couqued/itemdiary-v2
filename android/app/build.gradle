plugins {
    id "com.android.application"
    id "com.facebook.react"
}
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.openended.keep_product"

    defaultConfig {
        applicationId "com.openended.keep_product"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "1.3.1"
        multiDexEnabled true
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        // 16KB 페이지 크기 지원 - ELF 세그먼트 정렬 링커 플래그
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                cFlags "-D__BIONIC_NO_PAGE_SIZE_MACRO"
                cppFlags "-D__BIONIC_NO_PAGE_SIZE_MACRO"
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += ['**/*.so']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('upload.keystore')
            storePassword project.findProperty('UPLOAD_STORE_PASSWORD') ?: System.getenv("UPLOAD_STORE_PASSWORD") ?: ""
            keyAlias 'upload'
            keyPassword project.findProperty('UPLOAD_KEY_PASSWORD') ?: System.getenv("UPLOAD_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            // debug : 기기 테스트용 디버그 서명
            signingConfig signingConfigs.release
            //signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.activity:activity:1.9.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

project.ext.vectoricons = [
    iconFontNames: [ 'Ionicons.ttf' ]
]

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
