<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 아이템북 아이콘 배경: 브랜드 블루 그라데이션 + 하늘색 빛 번짐 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FB6FF"/><stop offset=".55" stop-color="#3B6EF5"/><stop offset="1" stop-color="#1E3FB8"/></linearGradient>
    <radialGradient id="blobA" cx="0.85" cy="0.12" r="0.55"><stop offset="0" stop-color="#9BD8FF" stop-opacity=".6"/><stop offset="1" stop-color="#9BD8FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#C4D6FF" stop-opacity=".45"/><stop offset="1" stop-color="#C4D6FF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
