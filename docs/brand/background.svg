<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 아이템 다이어리 아이콘 배경: 블루바이올렛 그라데이션 + 라벤더/시안 빛 번짐 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B3C3FF"/><stop offset=".55" stop-color="#7A80F2"/><stop offset="1" stop-color="#4B4FD6"/></linearGradient>
    <radialGradient id="blobA" cx="0.85" cy="0.12" r="0.55"><stop offset="0" stop-color="#D9C9FF" stop-opacity=".7"/><stop offset="1" stop-color="#D9C9FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#8FDFFF" stop-opacity=".55"/><stop offset="1" stop-color="#8FDFFF" stop-opacity="0"/></radialGradient>
